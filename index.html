<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotify Mini Player (PKCE)</title>
<style>
  body {
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0e0b18;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#fff;
  }
  .mini-player {
    width:340px;
    background:#161225;
    padding:16px;
    border-radius:18px;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    text-align:center;
  }
  button {
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#1db954;
    color:#fff;
    cursor:pointer;
    font-size:14px;
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="mini-player">
    <div id="content">
        <p>Belum terhubung ke Spotify</p>
        <button onclick="login()">Connect to Spotify</button>
    </div>
</div>

<script>
const CLIENT_ID = "a73016ea14604eac89edca5fc1da15d1";
const REDIRECT_URI = "https://yakultsy.github.io/mini-player/";
const SCOPES = "user-read-currently-playing user-read-playback-state user-modify-playback-state";

let accessToken = null;

/* ------------------ PKCE FUNCTIONS --------------------- */

async function generateCodeVerifier(length = 128) {
    let text = "";
    const possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
    return text;
}

async function generateCodeChallenge(codeVerifier) {
    const data = new TextEncoder().encode(codeVerifier);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function login() {
    const codeVerifier = await generateCodeVerifier();
    const codeChallenge = await generateCodeChallenge(codeVerifier);

    localStorage.setItem("verifier", codeVerifier);

    const authUrl =
        "https://accounts.spotify.com/authorize" +
        `?client_id=${CLIENT_ID}` +
        `&response_type=code` +
        `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
        `&code_challenge_method=S256` +
        `&code_challenge=${codeChallenge}` +
        `&scope=${encodeURIComponent(SCOPES)}`;

    window.location = authUrl;
}

async function handleCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (!code) return;

    const verifier = localStorage.getItem("verifier");

    const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
    });

    const result = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
    });

    const data = await result.json();
    accessToken = data.access_token;

    loadPlayer();
}

async function loadPlayer() {
    if (!accessToken) return;

    const res = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
        headers: { Authorization: `Bearer ${accessToken}` }
    });

    if (res.status === 204) {
        document.getElementById("content").innerHTML = "<p>Tidak ada lagu yang diputar.</p>";
        return;
    }

    const data = await res.json();
    const track = data.item;

    document.getElementById("content").innerHTML = `
        <img src="${track.album.images[0].url}" width="80" style="border-radius:12px;margin-bottom:10px;">
        <p><b>${track.name}</b><br>${track.artists[0].name}</p>
        <button onclick="togglePlay()">Play / Pause</button>
    `;
}

async function togglePlay() {
    await fetch("https://api.spotify.com/v1/me/player/pause", {
        method: "PUT",
        headers: { Authorization: `Bearer ${accessToken}` }
    });
}

handleCallback();
</script>

</body>
</html>
